  <text x="250" y="277" class="small" fill="var(--primary)" font-weight="700">Datos generales</text>
  <text x="250" y="308" class="small muted">Clasificación</text>
  <text x="250" y="339" class="small muted">Coste de compra</text>
  <text x="250" y="370" class="small muted">Datos físicos</text>
  <text x="250" y="401" class="small muted">SKUs</text>
  <rect x="430" y="230" width="590" height="218" rx="12" class="card"/>
