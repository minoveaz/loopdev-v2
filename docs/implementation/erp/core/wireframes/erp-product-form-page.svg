  <text x="875" y="755" class="tiny muted">Permiso pendiente</text>
  <rect x="430" y="784" width="590" height="136" rx="12" class="card"/>
  <text x="450" y="812" class="tiny" fill="var(--primary)" font-weight="700">DATOS FÍSICOS · SOLO PRODUCTOS FÍSICOS</text>
  <text x="450" y="840" class="label">Peso</text><rect x="450" y="848" width="110" height="32" rx="7" class="input"/><text x="463" y="869" class="small">0,80</text>
  <rect x="568" y="848" width="80" height="32" rx="7" class="input"/><text x="580" y="869" class="small">kg  ▾</text>
  <text x="668" y="840" class="label">Largo × ancho × alto</text>
  <rect x="668" y="848" width="275" height="32" rx="7" class="input"/><text x="681" y="869" class="small">32 × 18 × 8 cm</text>
  <text x="450" y="904" class="tiny muted">Los detalles que varían se registran en el SKU correspondiente.</text>
  <rect x="1168" y="100" width="390" height="850" rx="24" fill="var(--card)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="1190" y="136" class="small" font-weight="700">‹  Productos</text>
  <text x="1190" y="177" class="tiny muted">ERP / PRODUCTOS / NUEVO</text>
  <text x="1190" y="208" font-size="20" font-weight="700">Nuevo producto</text>
  <text x="1190" y="231" class="tiny muted">Borrador · sin guardar</text>
  <line x1="1169" y1="250" x2="1557" y2="250" stroke="var(--border)"/>
  <text x="1190" y="279" class="tiny" fill="var(--primary)" font-weight="700">DATOS GENERALES</text>
  <text x="1190" y="308" class="label">Nombre *</text><rect x="1190" y="316" width="346" height="40" rx="8" class="input"/><text x="1205" y="342" class="small">Arnés Trail</text>
  <text x="1190" y="383" class="label">Categoría principal</text><rect x="1190" y="391" width="346" height="40" rx="8" class="input"/><text x="1205" y="417" class="small">Arneses  ▾</text>
  <text x="1190" y="458" class="label">Marca</text><rect x="1190" y="466" width="346" height="40" rx="8" class="input"/><text x="1205" y="492" class="small">Seleccionar marca  ▾   + Añadir</text>
  <rect x="1190" y="526" width="346" height="116" rx="10" class="card"/>
  <text x="1206" y="552" class="tiny" fill="var(--primary)" font-weight="700">COSTE DE COMPRA DE REFERENCIA</text>
  <text x="1206" y="576" class="tiny muted">No contable · sin cálculo de margen</text>
  <rect x="1206" y="588" width="200" height="38" rx="8" class="input"/><text x="1220" y="613" class="small">12,50</text>
  <rect x="1414" y="588" width="106" height="38" rx="8" class="input"/><text x="1427" y="613" class="small">EUR  ▾</text>
  <rect x="1190" y="658" width="346" height="142" rx="10" class="card"/>
  <text x="1206" y="684" class="tiny" fill="var(--primary)" font-weight="700">DATOS FÍSICOS</text>
  <text x="1206" y="710" class="label">Peso</text><rect x="1206" y="718" width="168" height="38" rx="8" class="input"/><text x="1220" y="743" class="small">0,80 kg</text>
  <text x="1388" y="710" class="label">Dimensiones</text><rect x="1388" y="718" width="132" height="38" rx="8" class="input"/><text x="1397" y="743" class="tiny">32×18×8 cm</text>
  <text x="1206" y="783" class="tiny muted">Los detalles variables van en cada SKU.</text>
  <rect x="1169" y="832" width="388" height="1" fill="var(--border)"/>
  <rect x="1185" y="852" width="126" height="48" rx="8" fill="var(--card)" stroke="var(--border-strong)"/><text x="1223" y="882" class="small" font-weight="600">Cancelar</text>
  <rect x="1321" y="852" width="220" height="48" rx="8" class="primary"/><text x="1378" y="882" class="small" fill="white" font-weight="700">Guardar borrador</text>
  <text x="30" y="981" class="tiny muted" font-weight="700" letter-spacing="1.2">MOBILE WEB · PÁGINA COMPLETA · FOOTER STICKY · TARGETS ≥44 PX</text>
</svg>
