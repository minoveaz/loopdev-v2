<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CRM Pipeline low fidelity table detail creation wireframes</title>
  <desc id="desc">Review evidence for visual-design.md annotations T1 through T5, D1 through D5 and F1 through F5.</desc>
  <style>text{font:13px Arial;fill:#17202a} .line{stroke:#667085;stroke-width:1;fill:#fff} .muted{fill:#f2f4f7;stroke:#98a2b3} .accent{fill:#eef4ff;stroke:#4e73df} .note{fill:#fff7ed;stroke:#f79009}</style>
  <rect width="1200" height="760" fill="#fafafa"/><text x="30" y="30" font-size="21" font-weight="bold">CRM Pipeline surfaces · low fidelity review evidence</text>
  <g transform="translate(30,55)"><rect class="line" width="1140" height="205" rx="6"/><text x="18" y="25" font-weight="bold">T1–T5 Opportunity table (desktop)</text><rect class="muted" x="18" y="42" width="1100" height="32"/><text x="30" y="63">T2 Search · filters ▾ · columns ▾</text><text x="930" y="63">T3 cursor / page →</text><text x="24" y="98">▢  Acme renewal       Acme       $48k   Qualified   Maya   ⋮</text><text x="24" y="126">▢  Globex expansion   Globex     $22k   Proposal     Lee    ⋮</text><text x="24" y="154">▢  Offline draft       —          —      Pending      —      ⋮</text><text x="24" y="188">T4 loading/empty/error/forbidden rows use shared skeleton, alert and scope copy</text></g>
  <g transform="translate(30,285)"><rect class="line" width="550" height="330" rx="6"/><text x="18" y="25" font-weight="bold">D1–D5 Opportunity detail</text><rect class="accent" x="18" y="42" width="514" height="62" rx="4"/><text x="32" y="67">D2 Acme renewal · $48k · Qualified</text><text x="32" y="89">Owner Maya · health healthy · actions ⋮</text><text x="18" y="132">D3 Overview | Activity | Notes | Tasks | Relations</text><rect class="muted" x="18" y="150" width="240" height="125"/><text x="30" y="176">Summary / next action</text><text x="30" y="202">D4 stage history</text><text x="30" y="228">conflict / offline alert</text><rect class="note" x="276" y="150" width="256" height="125" rx="4"/><text x="288" y="178">D5 Forbidden: no data</text><text x="288" y="203">Error: retry</text><text x="288" y="228">Mobile: stack + sheet actions</text></g>
  <g transform="translate(600,285)"><rect class="line" width="570" height="330" rx="6"/><text x="18" y="25" font-weight="bold">F1–F5 Manual creation</text><text x="18" y="52">F2 Rivera drawer (desktop) / full-screen sheet (mobile)</text><rect class="muted" x="18" y="70" width="534" height="38" rx="4"/><text x="30" y="94">Identity: name, account/contact</text><rect class="muted" x="18" y="118" width="534" height="38" rx="4"/><text x="30" y="142">Value: amount · stage ▾ · next action 📅</text><rect class="note" x="18" y="170" width="534" height="54" rx="4"/><text x="30" y="193">F3 validation / F4 pending or offline queue</text><text x="30" y="214">preserve fields; prevent duplicate submit</text><rect class="accent" x="18" y="242" width="120" height="32" rx="4"/><text x="40" y="263">F5 Create</text><text x="160" y="263">success → detail link</text></g>
  <text x="30" y="680">Responsive rule: desktop tables/drawers collapse to compact rows/full-screen sheet below 768px.</text><text x="30" y="705">Review links: visual-design.md § Table / Detail / Manual creation; view-state-matrix.md</text>
</svg>
