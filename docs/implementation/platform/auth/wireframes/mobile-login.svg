<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%" style="background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Phone Background (Light Rivera Shell #f8fafc) -->
  <rect width="390" height="844" fill="#f8fafc" />

  <!-- Status Bar (iOS style) -->
  <g transform="translate(24, 14)">
    <text x="0" y="12" fill="#0f172a" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(300, 2)" fill="#0f172a">
      <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1" />
      <rect x="26" y="4" width="13" height="6" rx="1.5" />
      <rect x="45" y="5" width="1.5" height="4" rx="0.5" />
    </g>
  </g>

  <!-- Mobile LoopDev Brand Header -->
  <g transform="translate(24, 76)">
    <rect width="40" height="40" rx="12" fill="#135bec" />
    <path d="M0 8 H40 M0 16 H40 M0 24 H40 M0 32 H40 M8 0 V40 M16 0 V40 M24 0 V40 M32 0 V40" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <g transform="translate(6, 6) scale(0.28)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31.5,50c-8.5,0-15.5-7-15.5-15.5S23,19,31.5,19c5.2,0,9.8,2.5,12.5,6.5L56,43.5c2.7,4,7.3,6.5,12.5,6.5c8.5,0,15.5-7,15.5-15.5S77,19,68.5,19c-5.2,0-9.8,2.5-12.5,6.5L44,43.5C41.3,47.5,36.7,50,31.5,50z" />
    </g>
    <text x="52" y="27" fill="#135bec" font-size="22" font-weight="900" letter-spacing="-0.8">loop.dev</text>
    <rect x="146" y="11" width="62" height="18" rx="9" fill="#e2e8f0" />
    <text x="156" y="23" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">MOBILE</text>
  </g>

  <!-- Welcome Title Area -->
  <g transform="translate(24, 146)">
    <text x="0" y="0" fill="#135bec" font-size="11" font-weight="800" letter-spacing="2">SIGN IN</text>
    <text x="0" y="32" fill="#0f172a" font-size="28" font-weight="800" letter-spacing="-0.5">Welcome back</text>
    <text x="0" y="58" fill="#64748b" font-size="14">Sign in to access your organizations &amp; sync data.</text>
  </g>

  <!-- Login Form Fields Card -->
  <g transform="translate(24, 250)">
    <!-- Email Field -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#334155" font-size="12" font-weight="700">Email address</text>
      <rect x="0" y="8" width="342" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 24)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="18" height="14" rx="2" />
        <path d="M0 2 L9 8 L18 2" />
      </g>
      <text x="44" y="38" fill="#0f172a" font-size="14">user@loop.dev</text>
    </g>

    <!-- Password Field -->
    <g transform="translate(0, 84)">
      <text x="0" y="0" fill="#334155" font-size="12" font-weight="700">Password</text>
      <text x="242" y="0" fill="#135bec" font-size="12" font-weight="600">Forgot?</text>
      <rect x="0" y="8" width="342" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 23)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="1" y="6" width="16" height="10" rx="2" />
        <path d="M4 6 V4 A5 5 0 0 1 14 4 V6" />
      </g>
      <!-- Password Dots -->
      <circle cx="50" cy="33" r="3.5" fill="#0f172a" />
      <circle cx="62" cy="33" r="3.5" fill="#0f172a" />
      <circle cx="74" cy="33" r="3.5" fill="#0f172a" />
      <circle cx="86" cy="33" r="3.5" fill="#0f172a" />
      <circle cx="98" cy="33" r="3.5" fill="#0f172a" />
      <circle cx="110" cy="33" r="3.5" fill="#0f172a" />
      <!-- Eye Toggle -->
      <g transform="translate(308, 24)" stroke="#64748b" stroke-width="1.8" fill="none">
        <path d="M1 8 C4 3 13 3 16 8 C13 13 4 13 1 8 Z" />
        <circle cx="8.5" cy="8" r="2.5" />
      </g>
    </g>

    <!-- Biometric / Secure Storage Prompt -->
    <g transform="translate(0, 168)">
      <rect width="342" height="46" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <g transform="translate(12, 13)" stroke="#135bec" stroke-width="1.8" fill="none">
        <path d="M8 2 C4 2 1 6 1 11 C1 16 4 20 8 20" />
        <path d="M12 2 C16 2 19 6 19 11 C19 16 16 20 12 20" />
        <path d="M6 7 C8 5 12 5 14 7" />
        <path d="M6 15 C8 17 12 17 14 15" />
      </g>
      <text x="40" y="28" fill="#1e40af" font-size="12" font-weight="600">Enable Face ID / Biometric unlock</text>
      <!-- Switch Toggle (On) -->
      <rect x="296" y="13" width="34" height="20" rx="10" fill="#135bec" />
      <circle cx="320" cy="23" r="7.5" fill="#ffffff" />
    </g>

    <!-- Sign In CTA Button -->
    <g transform="translate(0, 236)">
      <rect width="342" height="50" rx="10" fill="#135bec" />
      <text x="145" y="31" fill="#ffffff" font-size="15" font-weight="700">Sign In</text>
    </g>

    <!-- Divider -->
    <g transform="translate(0, 316)">
      <line x1="0" y1="0" x2="130" y2="0" stroke="#e2e8f0" />
      <text x="142" y="4" fill="#94a3b8" font-size="10" font-weight="700">OR WITH</text>
      <line x1="212" y1="0" x2="342" y2="0" stroke="#e2e8f0" />
    </g>

    <!-- SSO Button -->
    <g transform="translate(0, 338)">
      <rect width="342" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="120" y="28" fill="#334155" font-size="13" font-weight="600">Single Sign-On (SSO)</text>
    </g>
  </g>

  <!-- Home Indicator (iOS) -->
  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.3" />
</svg>
