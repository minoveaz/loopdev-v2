<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Security page wireframe: desktop and mobile</title>
  <desc id="desc">Security view with provider-backed account email, password and MFA; session inventory is explicitly pending verification.</desc>
  <defs><style>
    text{font-family:Geist,Inter,system-ui,sans-serif;fill:#202536}.muted{fill:#6c7280}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.label{font-size:12px;font-weight:600}.head{font-size:25px;font-weight:650;letter-spacing:-.5px}.subhead{font-size:16px;font-weight:650}.card{fill:#fff;stroke:#dfe2ea}.outline{fill:#fff;stroke:#dfe2ea}.soft{fill:#f0f1ff;stroke:#e0e2ff}.warn{fill:#fff8e9;stroke:#f1d28b}.primary{fill:#414bd2}.primaryText{fill:#fff;font-size:12px;font-weight:600}.line{stroke:#e6e8ef}
  </style></defs>
  <rect width="1200" height="760" fill="#f8f9fc"/><text x="36" y="28" class="tiny muted">ACCOUNT · SECURITY — CONCEPTUAL WIREFRAME / NO FAKE SESSION DATA</text>
  <rect x="28" y="48" width="748" height="680" rx="12" fill="#f8f9fc" stroke="#dfe2ea"/><rect x="28" y="48" width="748" height="44" rx="12" fill="#fff"/>
  <text x="50" y="76" class="small">LoopDev</text><text x="115" y="76" class="tiny muted">Workspace / Account</text>
  <rect x="43" y="112" width="118" height="586" rx="8" fill="#fff" stroke="#e6e8ef"/><text x="59" y="143" class="tiny muted">WORKSPACE</text><text x="59" y="177" class="small muted">Overview</text><text x="59" y="210" class="small muted">CRM</text><rect x="54" y="228" width="96" height="34" rx="7" class="soft"/><text x="66" y="250" class="small">Account</text>
  <text x="181" y="131" class="tiny muted">Account / Security</text><text x="181" y="167" class="head">Security</text><text x="181" y="191" class="small muted">Manage your sign-in and verification methods.</text>
  <rect x="181" y="214" width="560" height="146" rx="11" class="card"/><text x="202" y="245" class="subhead">Email address</text><text x="202" y="271" class="small muted">Current sign-in address</text><text x="202" y="296" class="body">your account email</text>
  <rect x="626" y="260" width="94" height="34" rx="8" class="outline"/><text x="646" y="282" class="small">Change</text><line x1="202" y1="316" x2="720" y2="316" class="line"/><text x="202" y="342" class="tiny muted">A new address becomes active after provider confirmation.</text>
  <rect x="181" y="376" width="560" height="112" rx="11" class="card"/><text x="202" y="408" class="subhead">Password</text><text x="202" y="433" class="small muted">Update your password after re-authentication.</text><rect x="626" y="420" width="94" height="34" rx="8" class="outline"/><text x="646" y="442" class="small">Update</text>
  <rect x="181" y="504" width="560" height="104" rx="11" class="card"/><text x="202" y="536" class="subhead">Multi-factor authentication</text><text x="202" y="562" class="small muted">Provider status will appear here after loading.</text><rect x="626" y="534" width="94" height="34" rx="8" class="primary"/><text x="643" y="556" class="primaryText">Set up MFA</text>
  <rect x="181" y="624" width="560" height="64" rx="10" class="warn"/><text x="201" y="650" class="small">Session list unavailable until the auth provider supports it.</text><text x="201" y="672" class="tiny muted">No device rows are shown without authoritative session data.</text>
  <text x="181" y="710" class="tiny muted">Desktop web · sensitive actions require reauth; unsupported means unavailable</text>
  <rect x="812" y="48" width="360" height="680" rx="28" fill="#fff" stroke="#cfd3dd" stroke-width="2"/><rect x="820" y="58" width="344" height="660" rx="22" fill="#f8f9fc"/>
  <rect x="820" y="58" width="344" height="52" rx="22" fill="#fff"/><text x="842" y="91" class="small">‹  Account</text><text x="1017" y="91" class="small">Security</text>
  <text x="842" y="143" class="tiny muted">ACCOUNT / SECURITY</text><text x="842" y="177" class="head">Security</text>
  <rect x="840" y="195" width="304" height="125" rx="12" class="card"/><text x="858" y="226" class="subhead">Email address</text><text x="858" y="251" class="tiny muted">Current sign-in address</text><text x="858" y="275" class="small">your account email</text>  <rect x="1042" y="239" width="84" height="44" rx="8" class="outline"/><text x="1062" y="266" class="tiny">Change</text><text x="858" y="302" class="tiny muted">New address requires confirmation.</text>
  <rect x="840" y="330" width="304" height="100" rx="12" class="card"/><text x="858" y="361" class="subhead">Password</text><text x="858" y="385" class="tiny muted">Re-authentication required.</text><rect x="1007" y="378" width="119" height="44" rx="8" class="outline"/><text x="1034" y="405" class="tiny">Update</text>
  <rect x="840" y="440" width="304" height="120" rx="12" class="card"/><text x="858" y="471" class="subhead">Multi-factor auth</text><text x="858" y="495" class="tiny muted">Provider status loads here.</text><rect x="858" y="506" width="268" height="44" rx="8" class="primary"/><text x="950" y="533" class="primaryText">Set up MFA</text>
  <rect x="840" y="570" width="304" height="108" rx="12" class="warn"/><text x="858" y="601" class="small">Session list unavailable</text><text x="858" y="624" class="tiny muted">No devices shown until verified</text><text x="858" y="642" class="tiny muted">provider support exists.</text>
  <text x="842" y="704" class="tiny muted">Mobile web · same security operations and truth states</text>
</svg>
