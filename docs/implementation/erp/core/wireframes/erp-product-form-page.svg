  <text x="450" y="730" class="label">Importe por unidad</text>
  <rect x="450" y="738" width="300" height="24" rx="6" class="input"/>
  <text x="463" y="755" class="small">12,50</text>
  <text x="770" y="730" class="label">Moneda</text>
  <rect x="770" y="738" width="95" height="24" rx="6" class="input"/>
