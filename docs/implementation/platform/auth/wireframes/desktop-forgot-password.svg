<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#121b2d" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <radialGradient id="meshGlow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#135bec" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Left Side: Editorial Aside -->
  <rect x="0" y="0" width="600" height="800" fill="url(#editorialGrad)" />
  <rect x="0" y="0" width="600" height="800" fill="url(#dotGrid)" />
  <rect x="0" y="0" width="600" height="800" fill="url(#meshGlow)" />
  <line x1="600" y1="0" x2="600" y2="800" stroke="#1e293b" stroke-width="1" />

  <!-- LoopDev Official Brand Logo -->
  <g transform="translate(64, 64)">
    <rect width="40" height="40" rx="12" fill="#135bec" />
    <path d="M0 8 H40 M0 16 H40 M0 24 H40 M0 32 H40 M8 0 V40 M16 0 V40 M24 0 V40 M32 0 V40" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <g transform="translate(6, 6) scale(0.28)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31.5,50c-8.5,0-15.5-7-15.5-15.5S23,19,31.5,19c5.2,0,9.8,2.5,12.5,6.5L56,43.5c2.7,4,7.3,6.5,12.5,6.5c8.5,0,15.5-7,15.5-15.5S77,19,68.5,19c-5.2,0-9.8,2.5-12.5,6.5L44,43.5C41.3,47.5,36.7,50,31.5,50z" />
    </g>
    <text x="52" y="27" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="-0.8">loop.dev</text>
  </g>

  <!-- Editorial Copy -->
  <g transform="translate(64, 380)">
    <text x="0" y="0" fill="#f8fafc" font-size="40" font-weight="700" letter-spacing="-1">
      <tspan x="0" dy="0">Account recovery</tspan>
      <tspan x="0" dy="52" fill="#60a5fa">made effortless &amp; secure.</tspan>
    </text>
    <text x="0" y="130" fill="#94a3b8" font-size="16">
      <tspan x="0" dy="0">Instant magic reset links in local development and production,</tspan>
      <tspan x="0" dy="26">preserving tenant isolation and organizational privileges.</tspan>
    </text>
  </g>

  <!-- Right Side: Recovery Form Canvas -->
  <rect x="600" y="0" width="680" height="800" fill="#0b0f19" />

  <!-- Form Container -->
  <g transform="translate(740, 160)">
    <text x="0" y="0" fill="#135bec" font-size="11" font-weight="700" letter-spacing="2.5">RESET PASSWORD</text>
    <text x="0" y="36" fill="#f8fafc" font-size="32" font-weight="700" letter-spacing="-0.8">Forgot your password?</text>
    <text x="0" y="66" fill="#94a3b8" font-size="14">Enter your verified email and we will send you a secure recovery link.</text>

    <!-- Email Field -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">Registered email address</text>
      <rect x="0" y="10" width="400" height="46" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
      <g transform="translate(14, 25)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="18" height="14" rx="2" />
        <path d="M0 2 L9 8 L18 2" />
      </g>
      <text x="44" y="38" fill="#94a3b8" font-size="14">user@organization.com</text>
    </g>

    <!-- Info banner regarding SMTP / Dev mode -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="400" height="60" rx="8" fill="#1e293b" stroke="#135bec" stroke-opacity="0.4" stroke-width="1" />
      <g transform="translate(14, 16)" stroke="#38bdf8" stroke-width="1.8" fill="none">
        <circle cx="9" cy="9" r="8" />
        <line x1="9" y1="8" x2="9" y2="13" />
        <circle cx="9" cy="5" r="0.75" fill="#38bdf8" />
      </g>
      <text x="40" y="24" fill="#f1f5f9" font-size="12" font-weight="600">Local development &amp; testing</text>
      <text x="40" y="42" fill="#94a3b8" font-size="11">Reset links are captured via Inbucket or Supabase CLI bypass.</text>
    </g>

    <!-- Send Link Button -->
    <g transform="translate(0, 274)">
      <rect x="0" y="0" width="400" height="46" rx="8" fill="#135bec" />
      <text x="135" y="28" fill="#ffffff" font-size="14" font-weight="600" letter-spacing="0.2">Send recovery link</text>
    </g>

    <!-- Back to sign in link -->
    <g transform="translate(0, 350)">
      <text x="135" y="0" fill="#94a3b8" font-size="13">Remember your password? <tspan fill="#135bec" font-weight="600">Sign in</tspan></text>
    </g>
  </g>
</svg>
