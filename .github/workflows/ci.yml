name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  module-traceability:
    name: Validar trazabilidad de módulos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar contratos y checkpoints
        run: npm run validate:module-runs

      - name: Probar máquina de estados de delivery
        run: npm run test:delivery

      - name: Validar cobertura de requisitos y capacidades
        run: npm run validate:delivery-ledgers

      - name: Validar evidencia de delivery
        run: npm run validate:delivery-evidence

      - name: Validar contratos de capacidades
        run: npm run validate:contracts

      - name: Validar superficies de smoke
        run: npm run smoke:routes

      - name: Validar contrato multiplataforma
        run: npm run validate:multiplatform

      - name: Validar boundaries mobile
        run: npm run validate:mobile-boundaries

  changes:
    name: Identificar qué cambió
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.filter.outputs.application }}
      build: ${{ steps.filter.outputs.build }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - '.github/workflows/**'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'eslint.config.*'
              - 'tsconfig*.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
            build:
              - '.github/workflows/**'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
            mobile:
              - '.github/workflows/**'
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
  code-quality:
    name: Revisar reglas y tipos del código
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Revisar reglas de escritura con ESLint
        run: npm run lint

      - name: Comprobar tipos de TypeScript
        run: npm run typecheck

  tests:
    name: Ejecutar tests rápidos de componentes y contratos
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests unitarios y estructurales
        run: npm run test:quality

      - name: Ejecutar contratos contra adapters desktop y mobile
        run: npm run test:multiplatform-contracts

  build:
    name: Comprobar que la aplicación compila
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crear build de producción
        run: npm run build

  mobile-quality:
    name: Validar plataforma mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Instalar dependencias compartidas del workspace
        run: npm ci

      - name: Instalar dependencias mobile
        working-directory: apps/mobile
        run: npm ci

      - name: Comprobar tipos mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Validar Expo
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Generar bundle web mobile
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir /tmp/loopdev-mobile-web
