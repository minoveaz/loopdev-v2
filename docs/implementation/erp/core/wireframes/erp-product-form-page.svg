  <text x="450" y="382" class="label">Categoría principal</text>
  <rect x="450" y="390" width="270" height="36" rx="7" class="input"/>
  <text x="463" y="413" class="small">Arneses  ▾</text>
  <text x="735" y="382" class="label">Marca</text>
  <rect x="735" y="390" width="265" height="36" rx="7" class="input"/>
  <text x="748" y="413" class="small">Seleccionar marca  ▾   +</text>
  <rect x="430" y="462" width="590" height="172" rx="12" class="card"/>
  <text x="450" y="490" class="tiny" fill="var(--primary)" font-weight="700">CLASIFICACIÓN Y OPERACIÓN</text>
  <text x="450" y="515" class="small" font-weight="700">Producto terminado</text>
  <text x="450" y="542" class="label">Usos</text>
  <rect x="450" y="553" width="13" height="13" rx="2" class="primary"/><text x="452" y="564" class="tiny" fill="white">✓</text>
  <text x="470" y="564" class="small">Compra</text>
  <rect x="548" y="553" width="13" height="13" rx="2" class="primary"/><text x="550" y="564" class="tiny" fill="white">✓</text>
  <text x="568" y="564" class="small">Venta</text>
  <rect x="645" y="553" width="13" height="13" rx="2" class="primary"/><text x="647" y="564" class="tiny" fill="white">✓</text>
