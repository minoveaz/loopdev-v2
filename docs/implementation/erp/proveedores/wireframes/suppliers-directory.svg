<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" role="img" aria-labelledby="title desc">
  <title id="title">Supplier directory responsive wireframe</title>
  <desc id="desc">Synthetic supplier directory shown as a compact desktop table and mobile cards using Rivera semantic tokens.</desc>
  <style>
    text { font-family: Geist, system-ui, sans-serif; fill: hsl(222 32% 11%); }
    .muted { fill: hsl(222 12% 46%); }
    .small { font-size: 12px; }
    .body { font-size: 14px; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .title { font-size: 23px; font-weight: 700; }
    .card { fill: white; stroke: hsl(220 22% 92%); }
    .line { stroke: hsl(220 22% 92%); }
    .primary { fill: hsl(234 80% 58%); }
    .soft { fill: hsl(234 92% 96.5%); }
    .success { fill: hsl(158 70% 94%); }
    .warning { fill: hsl(36 96% 94%); }
    .shadow { filter: drop-shadow(0 1px 2px rgb(0 0 0 / .08)); }
  </style>
  <rect width="1480" height="1000" fill="hsl(220 30% 98.8%)"/>
  <text x="40" y="42" class="label muted">SUPPLIERS DIRECTORY · SOURCE: visual-design.md §2 · SYNTHETIC DATA</text>
  <text x="40" y="76" class="small muted">Desktop ≥ 768px</text>
  <text x="1095" y="76" class="small muted">Mobile &lt; 768px</text>

  <!-- Desktop composition -->
  <rect x="32" y="94" width="1015" height="862" rx="8" class="card shadow"/>
  <text x="68" y="132" class="small muted">ERP  /  Suppliers</text>
  <text x="68" y="174" class="title">Suppliers</text>
  <text x="68" y="199" class="small muted">Manage supplier relationships and purchase-to-pay setup.</text>
  <rect x="866" y="145" width="144" height="40" rx="6" class="primary"/>
  <text x="888" y="170" font-size="13" font-weight="600" fill="white">+ New supplier</text>
  <line x1="68" y1="220" x2="1010" y2="220" class="line"/>

  <rect x="68" y="242" width="340" height="38" rx="6" fill="white" stroke="hsl(220 22% 92%)"/>
  <circle cx="87" cy="260" r="6" fill="none" stroke="hsl(222 12% 46%)"/>
  <line x1="91" y1="264" x2="96" y2="269" stroke="hsl(222 12% 46%)"/>
  <text x="108" y="265" class="small muted">Search name, supplier code or item reference</text>
  <rect x="420" y="242" width="126" height="38" rx="6" fill="white" stroke="hsl(220 22% 92%)"/>
  <text x="436" y="265" class="small">Status: All  v</text>
