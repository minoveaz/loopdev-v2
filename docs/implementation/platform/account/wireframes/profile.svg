  <text x="858" y="435" class="tiny muted">Email and password are in</text><text x="858" y="451" class="tiny muted">Security.</text>
  <rect x="858" y="470" width="268" height="44" rx="8" class="primary"/>
  <text x="954" y="497" class="primaryText">Save changes</text>
  <rect x="840" y="548" width="304" height="100" rx="12" class="card"/>
  <text x="858" y="579" class="subhead">Profile ownership</text>
  <text x="858" y="601" class="tiny muted">This is your personal profile, not</text><text x="858" y="617" class="tiny muted">organization settings.</text>
  <text x="842" y="686" class="tiny muted">Mobile web · stacked form · same actions</text>
