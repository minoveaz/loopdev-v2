<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Profile page wireframe: desktop and mobile</title>
  <desc id="desc">LoopDev account Profile composition using Rivera colors and card patterns. Illustrative labels only.</desc>
  <defs>
    <style>
      text{font-family:Geist,Inter,system-ui,sans-serif;fill:#202536}.muted{fill:#6c7280}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.label{font-size:12px;font-weight:600}.head{font-size:25px;font-weight:650;letter-spacing:-.5px}.subhead{font-size:16px;font-weight:650}.card{fill:#fff;stroke:#dfe2ea}.field{fill:#fff;stroke:#dfe2ea}.primary{fill:#414bd2}.primaryText{fill:#fff;font-size:12px;font-weight:600}.soft{fill:#f0f1ff;stroke:#e0e2ff}.line{stroke:#e6e8ef}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8f9fc"/>
  <text x="36" y="28" class="tiny muted">ACCOUNT · PROFILE — CONCEPTUAL WIREFRAME / ILLUSTRATIVE COPY</text>
  <rect x="28" y="48" width="748" height="680" rx="12" fill="#f8f9fc" stroke="#dfe2ea"/>
  <rect x="28" y="48" width="748" height="44" rx="12" fill="#fff"/>
  <text x="50" y="76" class="small">LoopDev</text><text x="115" y="76" class="tiny muted">Workspace / Account</text>
  <rect x="43" y="112" width="118" height="586" rx="8" fill="#fff" stroke="#e6e8ef"/>
  <text x="59" y="143" class="tiny muted">WORKSPACE</text>
  <text x="59" y="177" class="small muted">Overview</text><text x="59" y="210" class="small muted">CRM</text><text x="59" y="243" class="small muted">Settings</text>
  <rect x="54" y="263" width="96" height="34" rx="7" class="soft"/><text x="66" y="285" class="small">Account</text>
  <text x="181" y="131" class="tiny muted">Account / Profile</text>
  <text x="181" y="167" class="head">Profile</text>
  <text x="181" y="191" class="small muted">Personal details visible across your organizations.</text>
  <rect x="181" y="215" width="560" height="280" rx="11" class="card"/>
  <text x="202" y="246" class="subhead">Personal information</text>
  <text x="202" y="267" class="small muted">Managed by your LoopDev user account.</text>
  <circle cx="231" cy="318" r="28" fill="#f0f1ff" stroke="#d9dcfa"/>
