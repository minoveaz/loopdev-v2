<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%" style="background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Mobile Viewport Canvas (Light Shell Theme #f8fafc) -->
  <rect width="390" height="844" fill="#f8fafc" />

  <!-- iOS Status Bar -->
  <g transform="translate(24, 14)">
    <text x="0" y="12" fill="#0f172a" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(300, 2)" fill="#0f172a">
      <rect x="24" y="2" width="20" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1" />
      <rect x="26" y="4" width="13" height="6" rx="1.5" />
      <rect x="45" y="5" width="1.5" height="4" rx="0.5" />
    </g>
  </g>

  <!-- Navigation Bar / Back button -->
  <g transform="translate(20, 54)">
    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M12 6 L4 14 L12 22" />
    </g>
    <text x="28" y="19" fill="#135bec" font-size="14" font-weight="600">Back to sign in</text>
  </g>

  <!-- Brand Logo Badge (LoopDev) -->
  <g transform="translate(24, 106)">
    <rect width="40" height="40" rx="12" fill="#135bec" />
    <path d="M0 8 H40 M0 16 H40 M0 24 H40 M0 32 H40 M8 0 V40 M16 0 V40 M24 0 V40 M32 0 V40" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <g transform="translate(6, 6) scale(0.28)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31.5,50c-8.5,0-15.5-7-15.5-15.5S23,19,31.5,19c5.2,0,9.8,2.5,12.5,6.5L56,43.5c2.7,4,7.3,6.5,12.5,6.5c8.5,0,15.5-7,15.5-15.5S77,19,68.5,19c-5.2,0-9.8,2.5-12.5,6.5L44,43.5C41.3,47.5,36.7,50,31.5,50z" />
    </g>
    <text x="52" y="27" fill="#135bec" font-size="22" font-weight="900" letter-spacing="-0.8">loop.dev</text>
    <rect x="146" y="11" width="62" height="18" rx="9" fill="#e2e8f0" />
    <text x="156" y="23" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">MOBILE</text>
  </g>

  <!-- Title & Copy -->
  <g transform="translate(24, 172)">
    <text x="0" y="0" fill="#135bec" font-size="11" font-weight="800" letter-spacing="2">RECOVER ACCOUNT</text>
    <text x="0" y="32" fill="#0f172a" font-size="26" font-weight="800" letter-spacing="-0.5">Forgot password?</text>
    <text x="0" y="58" fill="#64748b" font-size="14">Enter your verified email to receive a password reset link.</text>
  </g>

  <!-- Form Fields -->
  <g transform="translate(24, 280)">
    <!-- Email Field -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#334155" font-size="12" font-weight="700">Email address</text>
      <rect x="0" y="8" width="342" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <g transform="translate(14, 24)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="18" height="14" rx="2" />
        <path d="M0 2 L9 8 L18 2" />
      </g>
      <text x="44" y="38" fill="#0f172a" font-size="14">user@organization.com</text>
    </g>

    <!-- Development Mode / SMTP Alert Box -->
    <g transform="translate(0, 80)">
      <rect width="342" height="66" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <g transform="translate(12, 16)" stroke="#135bec" stroke-width="1.8" fill="none">
        <circle cx="8" cy="8" r="7" />
        <line x1="8" y1="7" x2="8" y2="11" />
        <circle cx="8" cy="4.5" r="0.5" fill="#135bec" />
      </g>
      <text x="36" y="24" fill="#1e40af" font-size="12" font-weight="700">Local dev &amp; testing environment</text>
      <text x="36" y="42" fill="#3b82f6" font-size="11">Reset links can be verified in Inbucket</text>
      <text x="36" y="56" fill="#3b82f6" font-size="11">or via Supabase CLI admin command.</text>
    </g>

    <!-- CTA Submit Button -->
    <g transform="translate(0, 172)">
      <rect width="342" height="50" rx="10" fill="#135bec" />
      <text x="110" y="31" fill="#ffffff" font-size="15" font-weight="700">Send recovery link</text>
    </g>

    <!-- Support Help -->
    <g transform="translate(0, 252)">
      <text x="75" y="0" fill="#64748b" font-size="13">Need further assistance? <tspan fill="#135bec" font-weight="700">Contact IT</tspan></text>
    </g>
  </g>

  <!-- iOS Home Indicator -->
  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.3" />
</svg>
