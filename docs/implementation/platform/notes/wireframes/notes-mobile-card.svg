<svg xmlns="http://www.w3.org/2000/svg" width="390" height="360" viewBox="0 0 390 360" role="img" aria-labelledby="title desc">
  <title id="title">Platform Notes mobile note card</title>
  <desc id="desc">A Rivera-inspired mobile note card with title, rich content preview, relation, visibility, author, update date and action menu trigger.</desc>
  <rect width="390" height="360" fill="#f8fafc"/>
  <text x="20" y="30" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748b">CUSTOMER 360 · NOTES</text>
  <text x="20" y="61" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Jordan Davis</text>
  <text x="20" y="84" font-family="sans-serif" font-size="12" fill="#64748b">Acme Corporation · 3 notes</text>
  <rect x="16" y="108" width="358" height="220" rx="12" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="16" y="108" width="4" height="220" rx="2" fill="#2563eb"/>
  <text x="34" y="141" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Renewal conversation</text>
  <circle cx="340" cy="137" r="18" fill="#f8fafc" stroke="#d7dee8"/>
  <text x="331" y="143" font-family="sans-serif" font-size="18" fill="#334155">⋯</text>
  <text x="34" y="174" font-family="sans-serif" font-size="14" fill="#334155">Jordan asked for a proposal before Friday.</text>
  <text x="34" y="197" font-family="sans-serif" font-size="14" fill="#334155">The procurement team will review it next week.</text>
  <rect x="34" y="218" width="104" height="26" rx="13" fill="#eff6ff"/>
  <text x="48" y="235" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Related contact</text>
  <rect x="146" y="218" width="68" height="26" rx="13" fill="#f1f5f9"/>
  <text x="161" y="235" font-family="sans-serif" font-size="11" fill="#475569">Team</text>
  <line x1="34" y1="262" x2="356" y2="262" stroke="#e5eaf0"/>
  <circle cx="48" cy="288" r="12" fill="#dbeafe"/>
  <text x="41" y="292" font-family="sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">MC</text>
  <text x="70" y="286" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Maya Chen</text>
  <text x="70" y="304" font-family="sans-serif" font-size="11" fill="#64748b">Updated today · Rich note</text>
  <text x="326" y="296" font-family="sans-serif" font-size="11" fill="#64748b">Open</text>
</svg>
