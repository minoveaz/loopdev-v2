  <text x="70" y="350" class="small" fill="var(--sidebar-foreground)">Overview</text>
  <rect x="51" y="359" width="156" height="28" rx="7" fill="var(--sidebar-accent)"/>
  <text x="70" y="378" class="small" fill="var(--sidebar-accent-foreground)" font-weight="600">Productos</text>
  <text x="47" y="433" class="tiny muted">TOOLS</text>
  <text x="57" y="462" class="small" fill="var(--sidebar-foreground)">Document Intelligence</text>
  <text x="47" y="520" class="tiny muted">WORKSPACE</text>
  <text x="57" y="549" class="small" fill="var(--sidebar-foreground)">Settings</text>
  <text x="250" y="187" class="tiny muted">PRODUCTOS · 28 REGISTROS</text>
