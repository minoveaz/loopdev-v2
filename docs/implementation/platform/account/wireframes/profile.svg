  <text x="202" y="448" class="tiny muted">Your sign-in email and password are managed in Security.</text>
  <line x1="181" y1="450" x2="741" y2="450" class="line"/>
  <rect x="626" y="460" width="94" height="34" rx="8" class="primary"/>
  <text x="649" y="482" class="primaryText">Save changes</text>
  <rect x="181" y="514" width="560" height="78" rx="11" class="card"/>
  <text x="202" y="545" class="subhead">Profile ownership</text>
  <text x="202" y="570" class="small muted">This profile belongs to you, not to the selected organization.</text>
  <text x="181" y="653" class="tiny muted">Desktop web · 1200+ · PageContainer narrow · SettingsCard / shared controls</text>
  <rect x="812" y="48" width="360" height="680" rx="28" fill="#fff" stroke="#cfd3dd" stroke-width="2"/>
  <rect x="820" y="58" width="344" height="660" rx="22" fill="#f8f9fc"/>
  <rect x="820" y="58" width="344" height="52" rx="22" fill="#fff"/>
  <text x="842" y="91" class="small">‹  Account</text><text x="1010" y="91" class="small">Profile</text>
  <text x="842" y="143" class="tiny muted">ACCOUNT / PROFILE</text>
  <text x="842" y="177" class="head">Profile</text>
  <text x="842" y="200" class="tiny muted">Personal details across your</text><text x="842" y="216" class="tiny muted">organizations.</text>
  <rect x="840" y="232" width="304" height="300" rx="12" class="card"/>
  <text x="858" y="263" class="subhead">Personal information</text>
