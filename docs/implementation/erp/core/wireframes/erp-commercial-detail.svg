  <text x="688" y="312" class="tiny" fill="var(--primary)" font-weight="700">IDENTIDAD</text>
  <text x="688" y="340" class="tiny muted">SKU</text>
  <text x="808" y="340" class="small mono" font-weight="600">MC-ARN-042</text>
  <text x="688" y="367" class="tiny muted">Clase</text>
  <text x="808" y="367" class="small">Terminado</text>
  <text x="688" y="394" class="tiny muted">Categoría</text>
  <text x="808" y="394" class="small">Arneses</text>
  <rect x="670" y="438" width="350" height="152" rx="10" class="card"/>
  <text x="688" y="464" class="tiny" fill="var(--primary)" font-weight="700">USOS Y ABASTECIMIENTO</text>
