  <text x="1190" y="213" font-size="21" font-weight="700">Arnés Trail</text>
  <text x="1190" y="237" class="tiny muted"><tspan class="mono">MC-ARN-042</tspan> · Producto terminado</text>
  <text x="1190" y="268" class="small" fill="var(--success)" font-weight="700">Active</text>
  <line x1="1169" y1="287" x2="1557" y2="287" class="line"/>
  <rect x="1190" y="305" width="346" height="38" rx="8" fill="var(--muted)"/>
  <text x="1203" y="329" class="tiny" fill="var(--primary)" font-weight="700">Detalle</text>
  <text x="1274" y="329" class="tiny muted">Oferta</text>
  <text x="1342" y="329" class="tiny muted">Variantes</text>
  <text x="1440" y="329" class="tiny muted">Precios</text>
  <rect x="1190" y="358" width="346" height="123" rx="10" class="card"/>
  <text x="1208" y="385" class="tiny" fill="var(--primary)" font-weight="700">IDENTIDAD</text>
  <text x="1208" y="414" class="tiny muted">SKU</text>
  <text x="1280" y="414" class="tiny muted mono">MC-ARN-042</text>
  <text x="1208" y="442" class="tiny muted">Clase · categoría</text>
  <text x="1208" y="464" class="small">Terminado · Arneses</text>
  <rect x="1190" y="495" width="346" height="146" rx="10" class="card"/>
  <text x="1208" y="522" class="tiny" fill="var(--primary)" font-weight="700">USOS Y ABASTECIMIENTO</text>
  <text x="1208" y="551" class="tiny muted">Usos</text>
  <text x="1280" y="551" class="tiny">Compra · venta · inventario</text>
  <text x="1208" y="580" class="tiny muted">Abastecimiento</text>
  <text x="1208" y="603" class="small">Comprar</text>
  <text x="1208" y="628" class="tiny muted">Las variantes heredan esta regla.</text>
  <rect x="1190" y="657" width="346" height="82" rx="10" class="card"/>
  <text x="1208" y="684" class="tiny" fill="var(--primary)" font-weight="700">DISPONIBILIDAD</text>
  <text x="1208" y="712" class="small" font-weight="700">Ecommerce · España</text>
  <text x="1208" y="731" class="tiny muted">El stock físico requiere Inventario.</text>
  <rect x="1190" y="762" width="346" height="44" rx="8" class="primary"/>
  <text x="1276" y="790" class="small" fill="var(--card)" font-weight="700">Gestionar comercialización</text>
  <text x="1190" y="834" class="tiny muted">“Manage” cambia de vista dentro del mismo drawer.</text>
</svg>
