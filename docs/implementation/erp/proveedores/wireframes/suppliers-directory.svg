  <text x="88" y="744" class="small muted">Showing 1–5 of 42 suppliers</text>
  <text x="848" y="744" class="small muted">Rows 10  v</text>
  <rect x="900" y="724" width="42" height="30" rx="5" fill="white" stroke="hsl(220 22% 92%)"/>
  <text x="913" y="744" class="small">‹</text>
  <rect x="950" y="724" width="42" height="30" rx="5" fill="white" stroke="hsl(220 22% 92%)"/>
