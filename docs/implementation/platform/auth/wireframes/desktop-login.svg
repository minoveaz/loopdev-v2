<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="editorialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#121b2d" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <radialGradient id="meshGlow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#135bec" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Split Screen Layout -->
  <!-- Left Side: Editorial Aside -->
  <rect x="0" y="0" width="600" height="800" fill="url(#editorialGrad)" />
  <rect x="0" y="0" width="600" height="800" fill="url(#dotGrid)" />
  <rect x="0" y="0" width="600" height="800" fill="url(#meshGlow)" />
  <line x1="600" y1="0" x2="600" y2="800" stroke="#1e293b" stroke-width="1" />

  <!-- Aside Content -->
  <!-- Official LoopDev Brand Logo (Infinity Mark) -->
  <g transform="translate(64, 64)">
    <rect width="40" height="40" rx="12" fill="#135bec" />
    <path d="M0 8 H40 M0 16 H40 M0 24 H40 M0 32 H40 M8 0 V40 M16 0 V40 M24 0 V40 M32 0 V40" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />
    <!-- Infinity Icon Path -->
    <g transform="translate(6, 6) scale(0.28)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31.5,50c-8.5,0-15.5-7-15.5-15.5S23,19,31.5,19c5.2,0,9.8,2.5,12.5,6.5L56,43.5c2.7,4,7.3,6.5,12.5,6.5c8.5,0,15.5-7,15.5-15.5S77,19,68.5,19c-5.2,0-9.8,2.5-12.5,6.5L44,43.5C41.3,47.5,36.7,50,31.5,50z" />
    </g>
    <text x="52" y="27" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="-0.8">loop.dev</text>
    <rect x="156" y="12" width="74" height="18" rx="9" fill="#1e293b" />
    <text x="166" y="24" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="1">PLATFORM</text>
  </g>

  <!-- Editorial Headline -->
  <g transform="translate(64, 380)">
    <text x="0" y="0" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="-1">
      <tspan x="0" dy="0">The enterprise workspace</tspan>
      <tspan x="0" dy="52">your team will actually</tspan>
      <tspan x="0" dy="52" fill="#60a5fa">enjoy using.</tspan>
    </text>
    <text x="0" y="140" fill="#94a3b8" font-size="16">
      <tspan x="0" dy="0">LoopDev unifies multi-tenant workspaces, CRM, notes,</tspan>
      <tspan x="0" dy="26">and operational context with high-performance editorial design.</tspan>
    </text>
  </g>

  <!-- Aside Footer -->
  <text x="64" y="740" fill="#64748b" font-size="11" font-weight="600" letter-spacing="2">LOOPDEV PLATFORM · 2026 EDITION</text>

  <!-- Right Side: Login Form Canvas -->
  <rect x="600" y="0" width="680" height="800" fill="#0b0f19" />

  <!-- Form Container (Centered) -->
  <g transform="translate(740, 140)">
    <!-- Header -->
    <text x="0" y="0" fill="#135bec" font-size="11" font-weight="700" letter-spacing="2.5">SIGN IN</text>
    <text x="0" y="36" fill="#f8fafc" font-size="32" font-weight="700" letter-spacing="-0.8">Welcome back</text>
    <text x="0" y="66" fill="#94a3b8" font-size="14">Enter your platform credentials to access your tenant workspace.</text>

    <!-- Form Fields -->
    <!-- Email Field -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">Email address</text>
      <rect x="0" y="10" width="400" height="46" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
      <g transform="translate(14, 25)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="0" y="0" width="18" height="14" rx="2" />
        <path d="M0 2 L9 8 L18 2" />
      </g>
      <text x="44" y="38" fill="#f8fafc" font-size="14">admin@loop.dev</text>
    </g>

    <!-- Password Field -->
    <g transform="translate(0, 196)">
      <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">Password</text>
      <text x="300" y="0" fill="#135bec" font-size="12" font-weight="500">Forgot password?</text>
      <rect x="0" y="10" width="400" height="46" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
      <g transform="translate(14, 24)" stroke="#64748b" stroke-width="1.8" fill="none">
        <rect x="1" y="6" width="16" height="10" rx="2" />
        <path d="M4 6 V4 A5 5 0 0 1 14 4 V6" />
      </g>
      <!-- Dots for password -->
      <circle cx="50" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="62" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="74" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="86" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="98" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="110" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="122" cy="33" r="3.5" fill="#f8fafc" />
      <circle cx="134" cy="33" r="3.5" fill="#f8fafc" />
      <!-- Eye Icon -->
      <g transform="translate(366, 25)" stroke="#64748b" stroke-width="1.8" fill="none">
        <path d="M1 8 C4 3 13 3 16 8 C13 13 4 13 1 8 Z" />
        <circle cx="8.5" cy="8" r="2.5" />
      </g>
    </g>

    <!-- Remember Me Checkbox -->
    <g transform="translate(0, 276)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#135bec" />
      <path d="M4 9 L7 12 L14 5" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="28" y="14" fill="#94a3b8" font-size="13">Remember this device for 30 days</text>
    </g>

    <!-- Sign In Button -->
    <g transform="translate(0, 318)">
      <rect x="0" y="0" width="400" height="46" rx="8" fill="#135bec" />
      <text x="172" y="28" fill="#ffffff" font-size="14" font-weight="600" letter-spacing="0.2">Sign In</text>
    </g>

    <!-- Divider -->
    <g transform="translate(0, 396)">
      <line x1="0" y1="0" x2="140" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="155" y="4" fill="#64748b" font-size="11" font-weight="500">OR CONTINUE WITH</text>
      <line x1="280" y1="0" x2="400" y2="0" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- SSO Button -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="400" height="42" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
      <text x="150" y="26" fill="#cbd5e1" font-size="13" font-weight="500">Enterprise SSO</text>
    </g>

    <!-- Bottom prompt -->
    <g transform="translate(0, 494)">
      <text x="80" y="0" fill="#94a3b8" font-size="13">Don't have an account? <tspan fill="#135bec" font-weight="600">Contact admin</tspan></text>
    </g>
  </g>
</svg>
