<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%" style="background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="sheetShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background App Screen (Light Shell #f8fafc with backdrop overlay) -->
  <rect width="390" height="844" fill="#f8fafc" />
  <rect width="390" height="844" fill="rgba(15,23,42,0.42)" />

  <!-- Bottom Sheet Container (White sheet matching MobileBottomSheet.tsx & MobileModal.tsx) -->
  <g transform="translate(0, 190)" filter="url(#sheetShadowLight)">
    <rect width="390" height="654" rx="22" fill="#ffffff" />

    <!-- Sheet Drag Handle Indicator -->
    <rect x="176" y="12" width="38" height="4" rx="2" fill="#cbd5e1" />

    <!-- User Profile Header -->
    <g transform="translate(24, 38)">
      <!-- Avatar with status -->
      <rect width="48" height="48" rx="14" fill="#135bec" />
      <text x="12" y="31" fill="#ffffff" font-size="18" font-weight="700">AD</text>
      <circle cx="44" cy="44" r="5" fill="#16a34a" stroke="#ffffff" stroke-width="2" />

      <text x="60" y="22" fill="#111827" font-size="20" font-weight="800">Admin User</text>
      <text x="60" y="40" fill="#64748b" font-size="13">admin@rivera.app</text>
      <rect x="236" y="8" width="106" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="246" y="22" fill="#135bec" font-size="10" font-weight="800">SUPER ADMIN</text>
    </g>

    <line x1="24" y1="104" x2="366" y2="104" stroke="#e5e7eb" />

    <!-- Organization Switcher Section inside Mobile Account Sheet -->
    <g transform="translate(24, 122)">
      <text x="0" y="0" fill="#135bec" font-size="10" font-weight="800" letter-spacing="1.5">SWITCH ORGANIZATION</text>

      <!-- Active Org Card -->
      <g transform="translate(0, 12)">
        <rect width="342" height="52" rx="10" fill="#eff6ff" stroke="#135bec" stroke-width="1.5" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#135bec" />
        <text x="20" y="31" fill="#ffffff" font-size="14" font-weight="700">A</text>
        <text x="52" y="24" fill="#111827" font-size="14" font-weight="700">Acme Global Corp</text>
        <text x="52" y="40" fill="#135bec" font-size="11" font-weight="600">Owner · 24 members</text>
        <!-- Active Checkmark -->
        <circle cx="316" cy="26" r="9" fill="#135bec" />
        <path d="M312 26 L315 29 L321 23" stroke="#ffffff" stroke-width="1.8" fill="none" />
      </g>

      <!-- Inactive Org Card -->
      <g transform="translate(0, 72)">
        <rect width="342" height="52" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="#8b5cf6" />
        <text x="20" y="31" fill="#ffffff" font-size="14" font-weight="700">S</text>
        <text x="52" y="24" fill="#1f2937" font-size="14" font-weight="600">Starlight Ventures</text>
        <text x="52" y="40" fill="#64748b" font-size="11">Member</text>
        <text x="312" y="31" fill="#94a3b8" font-size="14">→</text>
      </g>
    </g>

    <line x1="24" y1="268" x2="366" y2="268" stroke="#e5e7eb" />

    <!-- Standard Account Navigation Options -->
    <g transform="translate(24, 284)">
      <!-- Profile -->
      <g transform="translate(0, 0)">
        <circle cx="16" cy="18" r="7" stroke="#1f2937" stroke-width="1.8" fill="none" />
        <text x="44" y="23" fill="#1f2937" font-size="16" font-weight="600">Profile</text>
        <text x="328" y="23" fill="#94a3b8" font-size="16">→</text>
      </g>
      <!-- Account Settings -->
      <g transform="translate(0, 48)">
        <circle cx="16" cy="18" r="7" stroke="#1f2937" stroke-width="1.8" fill="none" stroke-dasharray="2 2" />
        <text x="44" y="23" fill="#1f2937" font-size="16" font-weight="600">Account settings</text>
        <text x="328" y="23" fill="#94a3b8" font-size="16">→</text>
      </g>
      <!-- Security -->
      <g transform="translate(0, 96)">
        <path d="M11 11 L16 8 L21 11 V18 C21 22 16 25 16 25 C16 25 11 22 11 18 Z" stroke="#1f2937" stroke-width="1.8" fill="none" />
        <text x="44" y="23" fill="#1f2937" font-size="16" font-weight="600">Security &amp; 2FA</text>
        <text x="328" y="23" fill="#94a3b8" font-size="16">→</text>
      </g>
      <!-- Billing -->
      <g transform="translate(0, 144)">
        <rect x="8" y="11" width="16" height="12" rx="2" stroke="#1f2937" stroke-width="1.8" fill="none" />
        <text x="44" y="23" fill="#1f2937" font-size="16" font-weight="600">Billing</text>
        <text x="328" y="23" fill="#94a3b8" font-size="16">→</text>
      </g>
    </g>

    <line x1="24" y1="492" x2="366" y2="492" stroke="#e5e7eb" />

    <!-- Sign Out Button (Mobile Red Accent #ef334e matching MobileAccountSheet.tsx) -->
    <g transform="translate(24, 510)">
      <g stroke="#ef334e" stroke-width="2" fill="none">
        <path d="M12 4 H6 A2 2 0 0 0 4 6 V20 A2 2 0 0 0 6 22 H12" />
        <polyline points="16 17 21 13 16 9" />
        <line x1="21" y1="13" x2="9" y2="13" />
      </g>
      <text x="44" y="18" fill="#ef334e" font-size="17" font-weight="700">Sign Out</text>
    </g>

    <!-- iOS Home Indicator -->
    <rect x="128" y="630" width="134" height="5" rx="2.5" fill="#0f172a" fill-opacity="0.2" />
  </g>
</svg>
