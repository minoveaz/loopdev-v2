  <text x="808" y="519" class="small">Comprar</text>
  <text x="688" y="546" class="tiny muted">Variantes</text>
  <text x="808" y="546" class="small">Heredan abastecimiento</text>
  <text x="688" y="573" class="tiny muted">No implica ejecución de fabricación.</text>
  <rect x="670" y="604" width="350" height="128" rx="10" class="card"/>
  <text x="688" y="630" class="tiny" fill="var(--primary)" font-weight="700">DISPONIBILIDAD</text>
  <text x="688" y="659" class="small" font-weight="700">Ecommerce · España</text>
  <text x="688" y="685" class="tiny muted">El stock físico requiere contrato de Inventario.</text>
  <rect x="670" y="749" width="350" height="50" rx="9" fill="var(--primary-soft)"/>
  <text x="690" y="770" class="tiny" font-weight="700">GESTIONAR CONFIGURACIÓN</text>
  <text x="690" y="790" class="tiny muted">Abrir la vista interna, no un segundo drawer.</text>
