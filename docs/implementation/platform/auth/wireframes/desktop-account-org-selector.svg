<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="dropdownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Shell Mock -->
  <rect width="1280" height="800" fill="#090d16" />

  <!-- Topbar -->
  <rect width="1280" height="64" fill="#0e1726" stroke="#1e293b" stroke-width="1" />

  <!-- App Title / Brand -->
  <g transform="translate(24, 18)">
    <rect width="28" height="28" rx="8" fill="#2563eb" />
    <path d="M8 8 H20 V12 H13 V15 H18 V19 H8 Z" fill="#ffffff" />
    <text x="38" y="20" fill="#f8fafc" font-size="18" font-weight="700">LoopDev</text>
    <text x="120" y="20" fill="#64748b" font-size="13" font-weight="500">/ CRM &amp; Platform</text>
  </g>

  <!-- Right Topbar Controls -->
  <!-- User Profile Trigger Button -->
  <g transform="translate(1040, 14)">
    <rect width="216" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Avatar -->
    <rect x="5" y="5" width="28" height="28" rx="6" fill="#2563eb" />
    <text x="12" y="24" fill="#ffffff" font-size="12" font-weight="700">AD</text>
    <text x="42" y="20" fill="#f8fafc" font-size="12" font-weight="600">Admin User</text>
    <text x="42" y="32" fill="#38bdf8" font-size="9" font-weight="700" letter-spacing="0.5">SUPER ADMIN / OWNER</text>
    <!-- Chevron -->
    <path d="M196 16 L201 22 L206 16" stroke="#94a3b8" stroke-width="1.8" fill="none" />
  </g>

  <!-- Account Dropdown with Embedded Organization Selector -->
  <g transform="translate(930, 68)" filter="url(#dropdownShadow)">
    <rect width="326" height="540" rx="12" fill="#0e1726" stroke="#1e293b" stroke-width="1.5" />

    <!-- Section 1: User Header -->
    <g transform="translate(20, 20)">
      <text x="0" y="0" fill="#f8fafc" font-size="14" font-weight="700">Admin User</text>
      <text x="0" y="16" fill="#94a3b8" font-size="12">admin@rivera.app</text>
      <rect x="180" y="-12" width="106" height="20" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="190" y="2" fill="#60a5fa" font-size="10" font-weight="700">PLATFORM OWNER</text>
    </g>

    <line x1="16" y1="52" x2="310" y2="52" stroke="#1e293b" stroke-width="1" />

    <!-- Section 2: Active Tenant / Organization Selector -->
    <g transform="translate(20, 72)">
      <text x="0" y="0" fill="#3b82f6" font-size="10" font-weight="700" letter-spacing="1.5">ACTIVE ORGANIZATION</text>

      <!-- Org 1: Currently Selected -->
      <g transform="translate(0, 12)">
        <rect width="286" height="48" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
        <rect x="8" y="8" width="32" height="32" rx="6" fill="#3b82f6" />
        <text x="18" y="29" fill="#ffffff" font-size="14" font-weight="700">A</text>
        <text x="48" y="24" fill="#ffffff" font-size="13" font-weight="600">Acme Global Corp</text>
        <text x="48" y="38" fill="#94a3b8" font-size="10">ID: org_acme · Owner</text>
        <!-- Active Checkmark -->
        <circle cx="266" cy="24" r="8" fill="#2563eb" />
        <path d="M262 24 L265 27 L270 21" stroke="#ffffff" stroke-width="1.8" fill="none" />
      </g>

      <!-- Org 2: Switchable Org -->
      <g transform="translate(0, 68)">
        <rect width="286" height="48" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="32" height="32" rx="6" fill="#8b5cf6" />
        <text x="18" y="29" fill="#ffffff" font-size="14" font-weight="700">S</text>
        <text x="48" y="24" fill="#cbd5e1" font-size="13" font-weight="500">Starlight Ventures</text>
        <text x="48" y="38" fill="#64748b" font-size="10">ID: org_starlight · Member</text>
      </g>

      <!-- Org 3: Switchable Org (Super Admin global view) -->
      <g transform="translate(0, 124)">
        <rect width="286" height="48" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
        <rect x="8" y="8" width="32" height="32" rx="6" fill="#10b981" />
        <text x="18" y="29" fill="#ffffff" font-size="14" font-weight="700">N</text>
        <text x="48" y="24" fill="#cbd5e1" font-size="13" font-weight="500">Nexus Health SL</text>
        <text x="48" y="38" fill="#64748b" font-size="10">ID: org_nexus · Global Access</text>
      </g>

      <!-- View All Organizations button (Super Admin only) -->
      <g transform="translate(0, 180)">
        <rect width="286" height="28" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <text x="75" y="18" fill="#94a3b8" font-size="11" font-weight="500">+ View all 42 organizations</text>
      </g>
    </g>

    <line x1="16" y1="298" x2="310" y2="298" stroke="#1e293b" stroke-width="1" />

    <!-- Section 3: Standard Account Navigation Links (Rivera template) -->
    <g transform="translate(20, 314)">
      <!-- Profile -->
      <g transform="translate(0, 0)">
        <text x="28" y="18" fill="#cbd5e1" font-size="13">Profile &amp; Personal Info</text>
        <circle cx="10" cy="14" r="5" stroke="#94a3b8" stroke-width="1.5" fill="none" />
        <path d="M3 24 A7 7 0 0 1 17 24" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      </g>
      <!-- Account Settings -->
      <g transform="translate(0, 32)">
        <text x="28" y="18" fill="#cbd5e1" font-size="13">Account Settings</text>
        <circle cx="10" cy="14" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      </g>
      <!-- Security -->
      <g transform="translate(0, 64)">
        <text x="28" y="18" fill="#cbd5e1" font-size="13">Security &amp; Passwords</text>
        <path d="M5 8 L10 5 L15 8 V13 C15 17 10 19 10 19 C10 19 5 17 5 13 Z" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      </g>
      <!-- Billing -->
      <g transform="translate(0, 96)">
        <text x="28" y="18" fill="#cbd5e1" font-size="13">Billing &amp; Subscriptions</text>
        <rect x="3" y="8" width="14" height="11" rx="2" stroke="#94a3b8" stroke-width="1.5" fill="none" />
      </g>
    </g>

    <line x1="16" y1="454" x2="310" y2="454" stroke="#1e293b" stroke-width="1" />

    <!-- Section 4: Sign Out -->
    <g transform="translate(20, 474)">
      <g stroke="#ef4444" stroke-width="1.8" fill="none">
        <path d="M7 2 H3 A2 2 0 0 0 1 4 V14 A2 2 0 0 0 3 16 H7" />
        <polyline points="10 12 14 9 10 6" />
        <line x1="14" y1="9" x2="5" y2="9" />
      </g>
      <text x="26" y="13" fill="#ef4444" font-size="13" font-weight="600">Sign Out</text>
    </g>
  </g>
</svg>
